<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#7c5cf0">
<link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin><link rel='preload' as='style' href='https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap' onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap'></noscript><title>LifeOS – Quản lý cuộc sống</title>
<style>
/* =====================================================================
   LifeOS · Design system — Premium dashboard, xanh lá + vàng nhạt
   ===================================================================== */
:root{
  --ac:#7c5cf0;--on:#fff;
  --acs:color-mix(in srgb,var(--ac) 11%,transparent);
  --ac2:color-mix(in srgb,var(--ac) 22%,transparent);
  --bg:#f4f2fb;--card:#fff;--fld:#ece8f8;--bd:#e3def2;
  --tx:#17141f;--mut:#6a6580;
  --sun:#e7e0ff;--sunt:#4a36b0;
  --ok:#2f855a;--bad:#c53030;--warn:#b7791f;
  --sh:0 1px 2px rgba(40,25,80,.05),0 10px 26px -16px rgba(40,25,80,.22);
  --hero:linear-gradient(160deg,#5a3de6,#8b6cff 62%,#bdb0ff);
  --r:14px;--hh:64px;--org:#f08a1c;--nw:232px;--nwm:72px;--rw:300px;
  --ease:cubic-bezier(.16,1,.3,1);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light
}
:root[data-theme=dark]{
  --bg:#0b0b0f;--card:#16161b;--fld:#202028;--bd:#26262f;
  --tx:#f1f0f7;--mut:#9a98ab;
  --sun:#2b2455;--sunt:#d6ccff;
  --ok:#5cbf84;--bad:#f0766b;--warn:#e0b34c;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 26px -16px rgba(0,0,0,.7);
  color-scheme:dark
}

/* ---------- Nền tảng ---------- */
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 var(--font);zoom:var(--z,1);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--ac);color:var(--on)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mut) 40%,transparent) transparent}
h1{font-size:22px;line-height:30px;font-weight:700;letter-spacing:-.02em}
h2{font-size:15px;line-height:22px;font-weight:650;margin-bottom:12px}
.sub{color:var(--mut);font-size:13.5px;margin:2px 0 20px}
.hd .sub{margin-bottom:0}
.mut{color:var(--mut);font-size:12.5px}
.big{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.red{color:var(--bad)}.grn{color:var(--ok)}.acc{color:var(--ac)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.hd h1{margin:0}

/* ---------- Header ---------- */
#top{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(var(--nw) + 28px);right:14px;height:var(--hh);padding:0 14px;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;overflow:hidden;z-index:6;transition:left .3s var(--ease)}
body.min #top{left:calc(var(--nwm) + 28px)}
#top:after{content:'';position:absolute;left:0;bottom:0;height:2px;width:var(--dp,0%);background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 40%,#c4b5fd));transition:width 1s}
.lg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;min-width:150px;letter-spacing:-.01em}
.lg b{width:34px;height:34px;border-radius:10px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-size:16px}
.ham,.ib{border:0;background:var(--fld);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:15px;flex-shrink:0;transition:background .2s}
.ham:hover,.ib:hover{background:var(--ac2)}
.sb{position:relative;width:min(380px,100%)}
.sb>svg{position:absolute;left:12px;top:8px;width:20px;color:var(--mut);pointer-events:none}
#sres{position:absolute;top:44px;left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:6px;z-index:8}
.r{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center}
.r:hover{background:var(--acs)}
.r b{color:var(--ac);font-size:11px;min-width:46px}
.r span{margin-left:auto;color:var(--mut);font-size:12px}
.rt{display:flex;align-items:center;gap:10px;margin-left:auto}
.av{width:36px;height:36px;border-radius:50%;background:var(--sun);color:var(--sunt);display:grid;place-items:center;font-weight:700}

/* ---------- Thanh điều hướng ---------- */
nav{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));bottom:14px;left:14px;width:var(--nw);padding:16px 12px;display:flex;flex-direction:column;gap:2px;background:var(--card);border-radius:22px;overflow:hidden auto;z-index:4;transition:width .3s var(--ease)}
nav.min{width:var(--nwm)}
nav button{position:relative;display:flex;align-items:center;gap:12px;padding:5px 8px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--mut);font-weight:500;font-size:13.5px;white-space:nowrap;text-align:left;transition:background .2s,color .2s}
nav button i{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;transition:background .2s,color .2s}
nav button svg{width:19px}
nav button:hover{background:var(--fld);color:var(--tx)}
nav button.on{background:var(--bg);color:var(--tx);font-weight:600}
nav button.on i{background:var(--ac);color:var(--on)}
nav h4{font-size:11px;letter-spacing:.08em;color:var(--mut);margin:18px 10px 6px;font-weight:600;white-space:nowrap}
nav.min h4{visibility:hidden}
.tip{margin-top:auto;padding:12px;border-radius:12px;background:var(--sun);color:var(--sunt);font-size:12px;display:grid;gap:4px;flex-shrink:0}
nav.min .tip{display:none}

/* ---------- Bố cục ---------- */
main{margin:calc(var(--hh) + 28px + env(safe-area-inset-top,0px)) calc(var(--rw) + 28px) 0 calc(var(--nw) + 28px);padding:0 0 28px;transition:margin .3s var(--ease);min-width:0}
body.min main{margin-left:calc(var(--nwm) + 28px)}
.v{max-width:1120px;margin:0 auto}
.v.anim{animation:rise .35s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#rp{position:fixed;top:calc(var(--hh) + 28px + env(safe-area-inset-top,0px));right:14px;bottom:0;width:var(--rw);padding:0 0 14px;overflow-y:auto;display:grid;gap:14px;align-content:start}
.fab{display:none;position:fixed;right:18px;bottom:24px;width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);color:var(--on);font-size:26px;cursor:pointer;z-index:7;place-items:center;box-shadow:0 10px 24px -8px var(--ac)}

/* ---------- Card, lưới ---------- */
.c{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g>.c:hover{border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
.st{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px}
.st h3{font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.st a{color:var(--ac);cursor:pointer;font-size:12.5px;font-weight:500}
.st a:hover{text-decoration:underline}
.si{width:38px;height:38px;border-radius:10px;background:var(--acs);color:var(--ac);display:grid;place-items:center;flex-shrink:0}
.si svg{width:20px}

/* ---------- Nút, ô nhập ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid transparent;border-radius:10px;background:var(--ac);color:var(--on);font-weight:600;font-size:13px;line-height:1;cursor:pointer;text-decoration:none;white-space:nowrap;transition:filter .15s,transform .1s,background .2s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:default}
.btn.o{background:var(--card);color:var(--tx);border-color:var(--bd)}
.btn.o:hover{background:var(--fld);filter:none}
.btn.w{background:#fff;color:#4a36b0;border-color:transparent}
.in{width:100%;min-height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--fld);outline:0;font-size:13.5px;transition:border-color .15s,box-shadow .15s,background .15s}
.in::placeholder{color:var(--mut)}
.in:focus{border-color:var(--ac);background:var(--card);box-shadow:0 0 0 3px var(--acs)}
textarea.in{padding:9px 12px;height:auto;resize:vertical;line-height:1.5}
select.in{padding-right:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.in{flex:1;min-width:110px;width:auto}
.nw{flex-wrap:nowrap}.nw>.in,.nw>select{min-width:0}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px;opacity:.7;padding:4px;border-radius:6px;transition:.15s}
.x:hover{color:var(--bad);opacity:1}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--acs);color:var(--ac);font-weight:600;white-space:nowrap}
.tag.today{background:var(--sun);color:var(--sunt)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.live{background:var(--ac);color:var(--on);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.55}}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tabs button{border:1px solid var(--bd);background:var(--card);height:34px;padding:0 14px;border-radius:99px;cursor:pointer;color:var(--mut);font-weight:500;font-size:13px;transition:.2s}
.tabs button:hover{color:var(--tx);border-color:var(--ac2)}
.tabs .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px;max-width:360px}
.seg button{flex:1;border:0;background:none;height:34px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--mut);font-size:13px;transition:.2s}
.seg .on{background:var(--ac);color:var(--on)}

/* ---------- Danh sách, tiến độ ---------- */
.it{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 6px;border-bottom:1px solid var(--bd);border-radius:8px;transition:background .15s}
.it:last-child{border-bottom:0}
.it:hover{background:var(--fld)}
.it .t{flex:1;min-width:0;word-break:break-word}
.it .row>.in{min-width:90px}
.done .t{text-decoration:line-through;color:var(--mut)}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;flex-shrink:0;display:grid;place-items:center;color:var(--on);font-size:12px;transition:.2s}
.ck:hover{border-color:var(--ac)}
.ck.d{background:var(--ac);border-color:var(--ac);animation:pk .3s}
@keyframes pk{50%{transform:scale(1.25)}}
.bar{height:7px;border-radius:9px;background:var(--acs);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#c4b5fd));transition:width .8s var(--ease)}
.rgs{display:flex;justify-content:space-around;flex-wrap:wrap;gap:14px}
.rgw{display:grid;gap:8px;justify-items:center;font-size:12px;color:var(--mut)}
.rg{width:80px;height:80px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--acs) 0);display:grid;place-items:center}
.rg b{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:14px;color:var(--tx)}
.wr{display:grid;grid-template-columns:70px 1fr 120px;gap:12px;align-items:center;padding:8px 0}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid var(--card);cursor:pointer;box-shadow:0 0 0 2px var(--bd);transition:.2s}
.sw button:hover{transform:scale(1.12)}
.sw .on{box-shadow:0 0 0 2px var(--tx)}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;color:var(--mut);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:8px}
.tb td{padding:10px 8px;border-top:1px solid var(--bd)}
.tb tr:hover td{background:var(--acs)}
.mo .tb .in{min-height:30px;padding:0 6px;font-size:12px;min-width:64px}

/* ---------- Modal, toast ---------- */
.mo{position:fixed;inset:0;background:rgba(10,18,12,.55);display:grid;place-items:center;padding:16px;z-index:30;animation:fd .2s}
.mo>div{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;width:min(440px,100%);max-height:88vh;overflow:auto;animation:pop .3s var(--ease);display:grid;gap:10px;box-shadow:0 30px 70px -24px rgba(0,0,0,.6)}
.mo.out{opacity:0;transition:.2s}
.mo.out>div{transform:scale(.95);transition:.2s}
@keyframes fd{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px)}}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:99px;z-index:70;font-weight:600;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:rise .25s var(--ease)}
#sp{position:fixed;inset:0;background:var(--bg);z-index:80;display:grid;place-items:center;animation:spo .4s .6s forwards}
#sp i{font-style:normal;font:700 34px var(--font);width:76px;height:76px;border-radius:22px;background:var(--ac);color:var(--on);display:grid;place-items:center;animation:spl .7s var(--ease);box-shadow:0 18px 40px -14px var(--ac)}
@keyframes spl{from{transform:scale(.6);opacity:0}}
@keyframes spo{to{opacity:0;visibility:hidden}}

/* ---------- Tổng quan ---------- */
.clk{display:inline-flex;align-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:3px 11px;border-radius:99px;font-weight:600;font-size:12px;margin:6px 0 2px;min-height:24px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tcard{background:var(--fld);border:1px solid var(--bd);border-radius:14px;padding:16px 12px 14px;text-align:center;cursor:pointer;transition:transform .25s var(--ease),border-color .2s}
.tcard:hover{transform:translateY(-3px);border-color:var(--ac)}
.tcard i{width:56px;height:56px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-size:22px;font-weight:700;font-style:normal;margin:0 auto 8px}
.tcard b{display:block;font-size:13.5px}
.tcard span{font-size:12px;color:var(--mut)}
.tcard small{display:block;font-size:10.5px;color:var(--mut);margin-bottom:4px}
.fxd{background:linear-gradient(135deg,#17352a,#244d38);color:#fff;border-color:transparent}
.fxd small{letter-spacing:.08em;font-weight:600;opacity:.75;font-size:11px}
.fxd b{display:block;font:italic 700 20px Georgia,serif;margin:8px 0 4px;color:#e7e0ff}
.fxd span{font-size:12px;opacity:.85}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fx{background:var(--acs);border-radius:12px;padding:12px}
.fx b{display:block;font:italic 700 15px Georgia,serif;color:var(--ac);margin-bottom:3px}
.fx span{font-size:12px;color:var(--mut)}

/* ---------- Lịch ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:12px;color:var(--mut);padding:4px}
.cal button{aspect-ratio:1;border:0;border-radius:12px;background:none;cursor:pointer;position:relative;transition:.2s;max-height:56px;font-size:13px}
.cal button:hover{background:var(--acs)}
.cal .td{background:var(--ac);color:var(--on)}
.cal .sel{outline:2px solid var(--ac);outline-offset:-2px}
.cal button i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
.cal .td i{background:var(--sun)}

/* ---------- Thời khóa biểu ---------- */
.dstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:14px}
.dstrip button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 4px;border:1px solid var(--bd);border-radius:14px;background:var(--card);cursor:pointer;color:var(--mut);transition:border-color .2s,background .2s,transform .2s var(--ease)}
.dstrip button b{font-size:16px;font-weight:700;color:var(--tx);line-height:1.3}
.dstrip button small{font-size:11px;white-space:nowrap}
.dstrip button:hover{border-color:var(--ac);transform:translateY(-2px)}
.dstrip button.on{background:var(--ac);border-color:var(--ac);color:var(--on);box-shadow:0 10px 22px -12px var(--ac)}
.dstrip button.on b{color:var(--on)}
.dstrip button.today:after{content:'';position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.dstrip button.on.today:after{background:var(--sun)}
.dpanel .hd{margin-bottom:8px}
.tl{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:14px;align-items:stretch;padding:14px 8px;border-bottom:1px solid var(--bd);border-radius:12px;cursor:pointer;transition:background .15s}
.tl:last-child{border-bottom:0}
.tl:hover{background:var(--fld)}
.tlt{display:flex;flex-direction:column;justify-content:center;text-align:right}
.tlt b{font-size:15px;line-height:1.3}
.tlt span{font-size:12px;color:var(--mut)}
.tlb{border-left:4px solid var(--k);padding:2px 0 2px 14px;min-width:0}
.tlh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tlh b{font-size:15px}
.tlb .nt{font-size:12.5px;margin-top:4px;color:var(--tx);opacity:.85}
.tlg{align-self:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--k)}
.tl.cf{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--warn) 55%,transparent)}
.tl.live{background:color-mix(in srgb,var(--k) 8%,transparent)}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;padding:36px 16px;margin-top:8px;border-radius:14px;background:color-mix(in srgb,var(--sun) 45%,transparent)}
.empty>div{font-size:34px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(168px,1fr));gap:12px;overflow-x:auto;padding:2px 2px 10px}
.wd{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh);transition:border-color .2s}
.wd:hover{border-color:var(--ac2)}
.wd.now{border-color:var(--ac)}
.wh{display:flex;justify-content:space-between;align-items:baseline}
.wd.now .wh b{background:var(--ac);color:var(--on);padding:1px 9px;border-radius:99px}
.cl{border-left:4px solid var(--k);background:color-mix(in srgb,var(--k) 9%,var(--card));border-radius:10px;padding:8px 10px;cursor:pointer;font-size:12.5px;transition:transform .2s var(--ease)}
.cl:hover{transform:translateY(-2px)}
.cl .tm{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--k)}
.cl .nt{font-size:12px;margin-top:3px;opacity:.85}
.cl.cf{outline:1.5px dashed var(--warn)}
.cl.cf .tm:after{content:'⚠ trùng giờ';color:var(--warn)}
.cl .tm{flex-wrap:wrap}.cl.cf .tm:after,.cl.live .tm:after{flex-basis:100%;font-weight:600}
.cl.live{box-shadow:0 0 0 2px var(--k)}
.cl.live .tm:after{content:'● đang học';animation:blink 1.6s infinite}
.el{display:inline-grid;place-items:center;width:22px;height:22px;border:1.5px solid var(--k);border-radius:6px;font-size:10px;font-weight:800;flex-shrink:0}
.wd .add{border:1px dashed var(--bd);background:none;border-radius:10px;cursor:pointer;color:var(--mut);margin-top:auto;min-height:32px}
.wd .add:hover{border-color:var(--ac);color:var(--ac)}

/* ---------- Tập trung ---------- */
.ring{width:210px;height:210px;margin:10px auto;display:block}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}

/* ---------- Từ vựng ---------- */

/* ===== Cinematic transitions (chỉ chuyển cảnh, không đổi thiết kế) ===== */
@keyframes cvIn{from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes cvUp{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes soft{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes moIn{from{opacity:0;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0)}to{opacity:1;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}}
@keyframes moCard{from{opacity:0;transform:translateY(24px) scale(.94);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes moUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(.96)}to{opacity:1;transform:translateX(-50%)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(8px) scale(.98)}}
.v.anim{animation:cvIn .5s var(--ease) backwards}
.v.anim :is(.hd,.c,.dstrip,.wd,.ins,.sx,.it.lg){animation:cvUp .6s var(--ease) backwards;animation-delay:.06s}
.v.anim :is(.hd,.c,.dstrip,.wd,.ins,.sx,.it.lg):nth-child(2){animation-delay:0.115s}
.v.anim :is(.hd,.c,.dstrip,.wd,.ins,.sx,.it.lg):nth-child(3){animation-delay:0.17s}
.v.anim :is(.hd,.c,.dstrip,.wd,.ins,.sx,.it.lg):nth-child(4){animation-delay:0.225s}
.v.anim :is(.hd,.c,.dstrip,.wd,.ins,.sx,.it.lg):nth-child(5){animation-delay:0.28s}
.v.anim :is(.hd,.c,.dstrip,.wd,.ins,.sx,.it.lg):nth-child(6){animation-delay:0.335s}
.v.anim :is(.hd,.c,.dstrip,.wd,.ins,.sx,.it.lg):nth-child(7){animation-delay:0.39s}
.v.anim :is(.hd,.c,.dstrip,.wd,.ins,.sx,.it.lg):nth-child(8){animation-delay:0.445s}
.v.anim :is(.hd,.c,.dstrip,.wd,.ins,.sx,.it.lg):nth-child(n+9){animation-delay:0.5s}
.v:not(.anim) :is(.dpanel,.wk,.tb){animation:soft .3s var(--ease) backwards}
.v:not(.anim) .dpanel .tl{animation:soft .3s var(--ease) backwards}
.v:not(.anim) .dpanel .tl:nth-child(3){animation-delay:0.06s}
.v:not(.anim) .dpanel .tl:nth-child(4){animation-delay:0.09s}
.v:not(.anim) .dpanel .tl:nth-child(5){animation-delay:0.12s}
.v:not(.anim) .dpanel .tl:nth-child(6){animation-delay:0.15s}
.v:not(.anim) .dpanel .tl:nth-child(7){animation-delay:0.18s}
.v:not(.anim) .dpanel .tl:nth-child(8){animation-delay:0.21s}
.mo{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:moIn .3s ease backwards}
.mo>div{animation:moCard .5s var(--ease) backwards}
.mo>div>*{animation:moUp .45s var(--ease) backwards;animation-delay:.07s}
.mo>div>:nth-child(2){animation-delay:0.11s}
.mo>div>:nth-child(3){animation-delay:0.15s}
.mo>div>:nth-child(4){animation-delay:0.19s}
.mo>div>:nth-child(5){animation-delay:0.23s}
.mo>div>:nth-child(6){animation-delay:0.27s}
.mo>div>:nth-child(7){animation-delay:0.31s}
.mo>div>:nth-child(n+8){animation-delay:.34s}
.mo.out{opacity:0;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);animation:none;transition:opacity .2s ease,backdrop-filter .2s ease}
.mo.out>div{opacity:0;transform:translateY(10px) scale(.97);filter:blur(4px);animation:none;transition:opacity .2s ease,transform .2s var(--ease),filter .2s ease}
.mo.out>div>*{animation:none}
.toast{animation:toastIn .35s var(--ease) backwards,toastOut .3s ease 1.7s forwards}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-delay:0s!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== v10 Premium Enterprise polish (additive, overrides only) ===== */
:root{
  --sh:0 0 0 1px rgba(60,40,120,.04),0 1px 2px rgba(40,25,80,.05),0 8px 20px -12px rgba(40,25,80,.18),0 22px 40px -28px rgba(40,25,80,.22);
  --sh-hi:0 0 0 1px color-mix(in srgb,var(--ac) 22%,transparent),0 2px 4px rgba(40,25,80,.06),0 18px 36px -16px color-mix(in srgb,var(--ac) 38%,rgba(40,25,80,.3));
  --hl:inset 0 1px 0 rgba(255,255,255,.7);
  --glow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent);
  --ease2:cubic-bezier(.22,1,.36,1)
}
:root[data-theme=dark]{
  --bg:#0a0a10;--card:#15151d;--fld:#1f1f29;--bd:#2a2a36;
  --mut:#a3a1b6;
  --sh:0 0 0 1px rgba(255,255,255,.03),0 1px 2px rgba(0,0,0,.5),0 14px 30px -16px rgba(0,0,0,.8);
  --sh-hi:0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent),0 18px 40px -16px color-mix(in srgb,var(--ac) 45%,#000);
  --hl:inset 0 1px 0 rgba(255,255,255,.05);
  --glow:0 0 0 4px color-mix(in srgb,var(--ac) 28%,transparent)
}
body{background:
  radial-gradient(900px 480px at 8% -8%,color-mix(in srgb,var(--ac) 9%,transparent),transparent 70%),
  radial-gradient(700px 420px at 100% 0,color-mix(in srgb,var(--ac) 6%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
/* surfaces */
.c{box-shadow:var(--hl),var(--sh);transition:border-color .25s,box-shadow .3s var(--ease2),transform .3s var(--ease2)}
.g>.c,.hg>.c{will-change:transform}
@media(hover:hover){.g>.c:hover,.hg>.c:hover{transform:translateY(-3px);box-shadow:var(--hl),var(--sh-hi)}}
nav,#top,.pn{box-shadow:var(--hl),var(--sh);border:1px solid color-mix(in srgb,var(--bd) 70%,transparent)}
#top{transition:left .3s var(--ease),box-shadow .3s}
#top.scr{box-shadow:var(--hl),0 14px 30px -16px rgba(40,25,80,.35)}
h1{letter-spacing:-.025em}
.big,.kpi{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
/* buttons */
.btn{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 88%,#fff),var(--ac));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 14px -8px var(--ac);transition:transform .25s var(--ease2),box-shadow .25s,filter .2s,background .2s;translate:var(--mx,0) var(--my,0)}
@media(hover:hover){.btn:hover{filter:brightness(1.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 12px 22px -10px var(--ac)}}
.btn:active{transform:scale(.96);filter:brightness(.96)}
.btn:focus-visible,.in:focus-visible{box-shadow:var(--glow)}
.btn svg,nav button svg,.fab svg{transition:transform .3s var(--ease2)}
@media(hover:hover){.btn:hover svg{transform:scale(1.12) rotate(-4deg)}}
.fab{transition:transform .3s var(--ease2),box-shadow .3s;translate:var(--mx,0) var(--my,0)}
.fab:active{transform:scale(.94)}
/* inputs, dropdowns, tabs */
.in{transition:border-color .2s,box-shadow .25s,background .2s}
.in:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.in:focus,.in:focus-within{border-color:var(--ac);box-shadow:var(--glow);outline:0}
.seg{box-shadow:inset 0 1px 2px rgba(40,25,80,.08)}
.seg button{transition:background .25s var(--ease2),color .2s,box-shadow .25s,transform .15s}
.seg button:active{transform:scale(.97)}
.seg button.on{box-shadow:0 4px 10px -4px color-mix(in srgb,var(--ac) 55%,transparent)}
#sres{box-shadow:var(--sh-hi);animation:v10in .22s var(--ease2) backwards;transform-origin:top}
#sres .r{border-radius:9px;transition:background .15s,padding-left .2s var(--ease2)}
#sres .r:hover{padding-left:14px}
/* nav */
nav button{transition:background .2s,color .2s,transform .25s var(--ease2),padding .25s var(--ease2)}
@media(hover:hover){nav button:hover{transform:translateX(2px)}}
nav button.on{box-shadow:var(--hl),0 0 0 1px color-mix(in srgb,var(--ac) 18%,transparent)}
nav button.on:before{content:'';position:absolute;left:-12px;top:20%;bottom:20%;width:3px;border-radius:0 3px 3px 0;background:var(--ac);animation:v10bar .35s var(--ease2) backwards}
nav button.on i{box-shadow:0 6px 14px -6px var(--ac)}
nav button:hover i svg{transform:scale(1.1)}
/* lists, tables, bars */
.it{transition:background .15s,transform .2s var(--ease2)}
.tb th{position:sticky;top:0;background:var(--card);z-index:1}
.tb td{transition:background .15s}
.bar{box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.bar i{box-shadow:0 0 10px -2px color-mix(in srgb,var(--ac) 60%,transparent)}
.dstrip button{transition:border-color .2s,background .25s,transform .25s var(--ease2),box-shadow .25s}
/* modal + toast */
.mo{background:color-mix(in srgb,#0b0816 55%,transparent)}
.mo>div{border-color:color-mix(in srgb,var(--bd) 80%,transparent);box-shadow:var(--hl),0 40px 80px -30px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.04)}
.toast{box-shadow:0 18px 36px -14px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);backdrop-filter:blur(8px)}
/* empty + skeleton */
.empty{border:1px dashed color-mix(in srgb,var(--ac) 28%,var(--bd));transition:border-color .25s,background .25s}
.empty>div{filter:drop-shadow(0 8px 14px color-mix(in srgb,var(--ac) 30%,transparent));animation:v10float 4s ease-in-out infinite}
.skl{position:relative;overflow:hidden;border-radius:8px;background:var(--fld);color:transparent!important}
.skl:after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--card) 70%,transparent),transparent);animation:v10sh 1.3s infinite}
/* keyframes */
@keyframes v10in{from{opacity:0;transform:translateY(-6px) scale(.98)}}
@keyframes v10bar{from{transform:scaleY(0)}}
@keyframes v10float{50%{transform:translateY(-4px)}}
@keyframes v10sh{to{transform:translateX(100%)}}
@keyframes v10draw{from{stroke-dashoffset:var(--len,400)}}
@keyframes v10grow{from{transform:scaleY(0)}}
.v svg path[stroke]:not([stroke=none]):not([fill]){stroke-dasharray:var(--len,none)}
.bars>*{transform-origin:bottom;animation:v10grow .7s var(--ease2) backwards}
.bars>:nth-child(2){animation-delay:.04s}.bars>:nth-child(3){animation-delay:.08s}.bars>:nth-child(4){animation-delay:.12s}.bars>:nth-child(5){animation-delay:.16s}.bars>:nth-child(6){animation-delay:.2s}.bars>:nth-child(n+7){animation-delay:.24s}
/* responsive */
@media(pointer:coarse){nav button,.btn,.seg button,.ht button{min-height:44px}.g>.c:hover{transform:none}}
@media(max-width:600px){.c{padding:14px}.mo>div{border-radius:20px 20px 0 0;align-self:end;width:100%;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}.mo{padding:0;place-items:end center}table.tb{display:block;overflow-x:auto}}
html{overflow-x:hidden}
@media(prefers-reduced-motion:reduce){.empty>div,.skl:after,.bars>*{animation:none!important}.btn,.fab{translate:none!important}}
body.mot-off .empty>div,body.mot-off .skl:after{animation:none!important}
body.mot-lite .bars>*{animation:none}

PD=`Phân tích tài liệu sau (văn bản và/hoặc ảnh). Tự nhận diện phần tiếng Anh và phần tiếng Việt. Chọn tối đa 40 từ/cụm từ tiếng Anh đáng học nhất (trình độ B1–C1, bỏ từ quá cơ bản). Nếu tài liệu là danh sách từ vựng có sẵn nghĩa thì giữ đúng nghĩa trong tài liệu. Trả về mảng JSON: [{"en","vi","ipa","pos","ex","exv"}] (ex = câu ví dụ tiếng Anh, exv = bản dịch tiếng Việt). Không bịa nghĩa, ưu tiên dữ liệu có sẵn; phiên âm IPA Anh–Mỹ; bỏ qua quảng cáo, tiêu đề, watermark, tên website. Chỉ trả về JSON.`;
const vjunk=/tailieuonthi|tài liệu ôn thi|theo dõi fanpage|luyện thi tiếng anh|no ?pain|lieupham|cô phạm liễu|team mrs|^\s*the end\s*$|cứ bước tiếp|đồng hành cùng em|#nopain|^\s*(unit \d+|test \d+|live [a-z])\b|^\s*bảng từ vựng/i,vclean=t=>t.split(/\r?\n/).filter(l=>!vjunk.test(l.trim())).join('\n');
const PT=`Bạn là trợ lý trích xuất từ vựng cực kỳ chính xác. Ảnh/văn bản có thể là BẢNG TỪ VỰNG tiếng Anh với các cột: STT | Từ vựng (kèm loại từ) | Phiên âm | Nghĩa tiếng Việt | Collocations & phrases. Với MỖI dòng STT (không bỏ sót dòng nào, kể cả dòng bị cắt sang trang) trả về object: {"en": từ/cụm chính ở dòng đầu cột Từ vựng, bỏ phần (v)/(n)/(adj)..., "pos": loại từ của từ chính, "ipa": phiên âm dòng đầu, bỏ dấu gạch chéo, "vi": nghĩa tiếng Việt của từ chính (nhiều nghĩa thì nối bằng "; "), "ex": collocation tiếng Anh đầu tiên bắt đầu bằng "-", "exv": bản dịch trong ngoặc ngay sau đó, "syn": các từ sau "CLO:", "opp": các từ sau "OPP:", "fam": các dạng từ khác cùng họ kèm loại từ}. Thiếu mục nào thì để chuỗi rỗng. BỎ QUA HOÀN TOÀN: banner, tiêu đề (UNIT, TEST, LIVE...), khẩu hiệu (#NoPainNoGain, No pain no gain), tên giáo viên, fanpage, watermark, tailieuonthi.net, số trang, chân trang, lời động viên cuối bài. Nếu nội dung KHÔNG phải bảng từ vựng thì chọn tối đa 40 từ/cụm tiếng Anh đáng học nhất (B1–C1) và dịch nghĩa. Chỉ trả về mảng JSON.`;
async function vsm(){const s=window.claude&&await claude.use('sample');if(!s)toast('AI chưa khả dụng ở bản này — các tính năng khác vẫn dùng được');return s}
async function vai(l){const s=await vsm();if(!s)return null;const o=[];for(let i=0;i<l.length;i+=20){const a=await s.json(PF+'\n'+JSON.stringify(l.slice(i,i+20).map(x=>({en:x.en||'',vi:x.vi||'',ctx:x.ex||''}))),{modelTier:'quick'}),r=Array.isArray(a)?a:(a&&a.items)||[];for(let j=0;j<Math.min(20,l.length-i);j++)o.push(r[j]||{})}return o}
const vmerge=(x,y)=>['en','vi','ipa','pos','ex','exv'].forEach(f=>{if(y&&y[f]&&!x[f])x[f]=String(y[f])});
async function vdeep(){const s=await vsm();if(!s)return;const im=VX.imgs||[];let L={};try{L=await s.limits()}catch(e){}
if(im.length&&!L.images)return toast('Phiên bản này chưa đọc được ảnh bằng AI');if(!VX.t.trim()&&!im.length)return toast('Chọn file hoặc dán văn bản trước');
const st=$('#vst'),ex=new Set(VCD().map(c=>c.en.toLowerCase())),R=[],S1=x=>String(x==null?'':x),
mk=x=>({k:'a',en:S1(x.en).replace(/\s*\((n|v|adj|adv|phr[a-z. ]*|phrase)\)\s*$/i,'').trim(),vi:S1(x.vi),ipa:S1(x.ipa).replace(/^\/|\/$/g,''),pos:S1(x.pos),ex:S1(x.ex),exv:S1(x.exv),syn:S1(x.syn),opp:S1(x.opp),fam:S1(x.fam),on:1}),
add=a=>(Array.isArray(a)?a:(a&&a.items)||[]).filter(x=>x&&x.en).forEach(x=>{const m=mk(x),k=m.en.toLowerCase();if(!k||R.some(r=>r.en.toLowerCase()==k))return;m.dup=ex.has(k);R.push(m)});
try{if(im.length){const sh=await Promise.all(im.slice(0,20).map(shrink));for(let i=0;i<sh.length;i+=2){if(st)st.textContent='✨ AI đang quét trang '+(i+1)+(sh.length>1?'/'+sh.length:'')+'…';
for(let t=0;t<2;t++){try{add(await s.json(PT,{modelTier:'default',images:sh.slice(i,i+2)}));break}catch(e){if(t)throw e}}}}
else add(await s.json(PT+'\nVăn bản:\n'+VX.t.slice(0,12000),{modelTier:'default'}));
VC=[...R,...VC.filter(x=>x.k!='a')];VK='all';VX.imgs=[];VX.scan=0;vup();
const miss=R.filter(x=>!x.dup&&(!x.vi||!x.ipa));if(miss.length){if($('#vst'))$('#vst').textContent='✨ Đang bổ sung '+miss.length+' mục thiếu…';try{const r=await vai(miss);if(r)miss.forEach((x,i)=>vmerge(x,r[i]))}catch(e){}}
vup();const nw=R.filter(x=>!x.dup).length;if(nw)A.vadd();toast('✨ AI quét được '+R.length+' từ'+(nw?' — đã tự thêm '+nw+' từ vào kho':' (đều đã có trong kho)'))}catch(e){toast('AI lỗi: '+(e.message||e.code||''));vup()}}
async function vfill(){const sel=VC.filter(x=>x.on&&!x.dup&&(!x.vi||!x.en||!x.ipa));if(!sel.length)return toast('Chọn mục cần AI điền');const st=$('#vst');if(st)st.textContent='✨ Đang điền '+sel.length+' mục…';try{const r=await vai(sel);if(r){sel.forEach((x,i)=>vmerge(x,r[i]));toast('Đã điền ✓')}}catch(e){toast('AI lỗi: '+(e.message||e.code||''))}vup()}

function vhome(){const C=VCD(),d=vdue(),l=vlg(),s=VS(),L=s.log,bars=[...Array(14)].map((_,i)=>{const k=addD(TD,i-13);return[k,(L[k]||{}).r||0]}),m=Math.max(1,...bars.map(x=>x[1])),ok=Object.values(L).reduce((a,x)=>a+x.ok,0),rv=Object.values(L).reduce((a,x)=>a+x.r,0);
return`<div class='g'>${[['Tổng số từ',C.length,'trong kho'],['Cần ôn',d.length,'hôm nay'],['Đã thuộc',C.filter(c=>c.iv>=21).length,'nhớ ≥ 21 ngày'],['Chuỗi ngày','🔥 '+vstreak(),'ngày liên tiếp']].map(x=>`<div class='c'><div class='mut'>${x[0]}</div><div class='big'>${x[1]}</div><div class='mut'>${x[2]}</div></div>`).join('')}</div>
<div class='g' style='grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px'><div class='c'><div class='st'><h3>MỤC TIÊU HÔM NAY</h3></div><div class='rgs'>${ringc(Math.min(100,Math.round(l.r/s.goal*100)),l.r+'/'+s.goal+' lượt ôn')}${ringc(rv?Math.round(ok/rv*100):0,'Độ chính xác')}</div><div class='row' style='margin-top:12px'><button class='btn' data-a='vtab' data-v='on'>▶ Ôn ngay (${d.length})</button><button class='btn o' data-a='vtab' data-v='nap'>＋ Nhập từ mới</button><select class='in' style='width:auto;flex:none' onchange='VS().goal=+this.value;save();vup()'>${[10,20,30,50,80].map(n=>`<option ${n==s.goal?'selected':''} value='${n}'>Mục tiêu ${n}/ngày</option>`).join('')}</select></div></div>
<div class='c'><div class='st'><h3>14 NGÀY GẦN ĐÂY</h3></div><div class='vbars'>${bars.map(x=>`<i title='${x[0].slice(5)}: ${x[1]} lượt' style='height:${x[1]/m*100}%'></i>`).join('')}</div><p class='mut' style='margin-top:10px'>Mỗi từ được nhắc lại đúng lúc sắp quên (1 → 3 → 7 → 16 ngày…). Đạt mục tiêu ngày sẽ tự tick thói quen “Học từ vựng”.</p></div></div>
${C.length?'':`<div class='c' style='margin-top:14px;text-align:center'><b>Kho từ đang trống</b><p class='mut' style='margin:6px 0 12px'>Thả một file (bài đọc, danh sách từ, phụ đề, ảnh chụp…) để bắt đầu.</p><button class='btn' data-a='vtab' data-v='nap'>📥 Nhập file đầu tiên</button></div>`}`}
function vimp(){return`<div class='c'><label class='vz' id='vdz' for='vf'><b>📂 Kéo thả file vào đây hoặc bấm để chọn</b><div class='mut' style='margin-top:6px'>Nhận mọi loại: .txt .docx .pdf .xlsx .csv .srt .md .html và cả ảnh chụp (AI đọc chữ). Chọn được nhiều file một lúc.</div></label><input type='file' id='vf' multiple hidden><textarea class='in' rows='6' style='margin-top:10px' placeholder='…hoặc dán văn bản: bài đọc, danh sách "apple - quả táo", lời bài hát, phụ đề…' oninput='VX.t=this.value'>${esc(VX.t)}</textarea><div class='row' style='margin-top:10px'><button class='btn' data-a='vrun'>🔍 Nhận diện</button><button class='btn o' data-a='vdeep'>✨ AI phân tích sâu</button><select class='in' style='width:auto;flex:none' onchange='VX.ml=this.value'>${[4,5,6,7].map(n=>`<option value='${n}' ${+VX.ml==n?'selected':''}>Từ ≥ ${n} chữ</option>`).join('')}</select><span class='mut' id='vst'></span></div></div>${VC.length?vres():''}`}
function vres(){const L=VC.map((x,i)=>[x,i]).filter(x=>VK=='all'||x[0].k==VK),KN={p:'↔ Cặp Anh–Việt',e:'🇬🇧 Từ Anh cần học',v:'🇻🇳 Việt (luyện dịch)',a:'✨ AI'},n=VC.filter(x=>x.on&&!x.dup).length;
return`<div class='c' style='margin-top:14px'><div class='st'><h3>KẾT QUẢ NHẬN DIỆN · ${VC.length} MỤC</h3></div><div class='tabs' style='flex-wrap:wrap'>${['all','p','e','v','a'].filter(k=>k=='all'||VC.some(x=>x.k==k)).map(k=>`<button class='${VK==k?'on':''}' data-a='vk' data-v='${k}'>${k=='all'?'Tất cả':KN[k]} (${k=='all'?VC.length:VC.filter(x=>x.k==k).length})</button>`).join('')}</div><p class='mut'>Tự tách phần tiếng Anh (từ đáng học, đã lọc từ quá phổ biến) và tiếng Việt (nghĩa / câu để luyện dịch ngược). Sửa trực tiếp trong ô, bỏ chọn mục không cần.</p><div class='row' style='margin:8px 0'><button class='btn o' data-a='vall' data-v='1'>Chọn hết</button><button class='btn o' data-a='vall' data-v='0'>Bỏ chọn</button><button class='btn o' data-a='vfill'>✨ AI điền nghĩa, IPA, ví dụ</button></div><div style='max-height:460px;overflow:auto'>${L.slice(0,200).map(([x,i])=>`<div class='it'><input type='checkbox' ${x.on?'checked':''} ${x.dup?'disabled':''} onchange='VC[${i}].on=this.checked;vcnt()'><div class='t'><div class='row'><input class='in' value='${esc(x.en)}' placeholder='English' oninput='VC[${i}].en=this.value'><input class='in' value='${esc(x.vi)}' placeholder='Tiếng Việt' oninput='VC[${i}].vi=this.value'></div>${x.ex?`<div class='mut'>${esc(x.ex)}</div>`:''}</div>${x.dup?`<span class='tag'>đã có</span>`:x.n>1?`<span class='tag'>×${x.n}</span>`:''}</div>`).join('')}</div><button class='btn' id='vab' style='margin-top:12px;width:100%' data-a='vadd'>＋ Thêm ${n} mục vào kho từ vựng</button></div>`}
function vrev(){const q=VQ;if(!q){const d=vdue();return`<div class='c' style='text-align:center'><div class='big'>${d.length}</div><p class='mut'>từ cần ôn hôm nay</p><div class='row' style='justify-content:center;margin:14px 0 4px'>${[['en','Anh → Việt'],['vi','Việt → Anh'],['mix','Trộn'],['ear','🎧 Nghe']].map(m=>`<button class='btn ${d.length?'':'o'}' data-a='vgo' data-v='${m[0]}'>${m[1]}</button>`).join('')}</div>${d.length?'<p class="mut">Phím tắt: Space lật thẻ · 1–4 chấm điểm</p>':'<p class="mut">Hôm nay không còn từ nào đến hạn 🎉 Hãy thêm từ mới hoặc luyện tập thêm.</p>'}</div>`}

function vmk(m){const all=VCD();return shuf(all.filter(c=>c.en&&(m=='listen'||c.vi))).slice(0,10).map(c=>{const rv=Math.random()<.5,q={c,m};if(m=='mcq'){const w=shuf(all.filter(x=>x.id!=c.id&&x.vi&&x.en)).slice(0,3);q.t=rv?'Từ tiếng Anh nào có nghĩa này?':'Nghĩa tiếng Việt của từ này?';q.p=rv?c.vi:c.en;q.a=rv?c.en:c.vi;q.o=shuf([q.a,...w.map(x=>rv?x.en:x.vi)])}else if(m=='type'){q.t='Gõ từ tiếng Anh có nghĩa:';q.p=c.vi;q.a=c.en}else{q.t='Nghe và gõ lại:';q.p='';q.a=c.en}return q})}
function vprac(){const P=VP;if(!P)return`<div class='g'>${[['mcq','🎯','Trắc nghiệm','Chọn từ / nghĩa đúng trong 4 đáp án'],['type','⌨️','Gõ từ','Đọc nghĩa tiếng Việt, gõ từ tiếng Anh'],['listen','🎧','Nghe & gõ','Nghe phát âm rồi gõ lại đúng chính tả']].map(m=>`<div class='c' style='cursor:pointer;text-align:center' data-a='vpr' data-v='${m[0]}'><div style='font-size:30px'>${m[1]}</div><b>${m[2]}</b><div class='mut'>${m[3]}</div></div>`).join('')}</div><p class='mut' style='margin-top:12px'>Mỗi lượt gồm 10 câu lấy từ kho của bạn. Đúng/sai sẽ tự cập nhật lịch ôn.</p>`;
